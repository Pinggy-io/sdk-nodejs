name: Build Binaries for macOS (x64)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }}) Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel]
        arch: [x64]
        node-version: [18, 19, 20, 21, 22, 23, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --install || true
          brew update
          brew install pkg-config automake autoconf libtool

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Install node-gyp globally
        shell: bash
        # Latest node-gyp crashes on Node 18/19/21 (its undici needs newer
        # runtime APIs), so pin the last node-gyp major that supports each.
        run: |
          case "$(node -p "process.versions.node.split('.')[0]")" in
            19) npm install -g node-gyp@10 ;;
            18|21) npm install -g node-gyp@11 ;;
            *) npm install -g node-gyp ;;
          esac

      - name: Build native addon and copy to lib
        run: |
          node-gyp clean
          node-gyp configure
          node-gyp build
          node ./copy.cjs

      - name: Package native binary
        run: npm run package
