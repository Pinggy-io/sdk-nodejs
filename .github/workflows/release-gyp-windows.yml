name: Release Binaries for Windows

on:
  release:
    types: [created]

jobs:
  build:
    name: Build Windows ${{ matrix.arch }} (Node ${{ matrix.node-version }})
    # Node 18/19/21 need node-gyp <= 11, which can't detect the VS2026 that
    # ships on windows-latest — run those on windows-2022 (VS2022) instead.
    runs-on: ${{ contains(fromJSON('[18, 19, 21]'), matrix.node-version) && 'windows-2022' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64] # You can add more like arm64 if needed
        node-version: [18, 19, 20, 21, 22, 23, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies and build
        run: |
          npm ci --ignore-scripts

      - name: Install node-gyp globally
        shell: bash
        # Latest node-gyp crashes on Node 18/19/21 (its undici needs newer
        # runtime APIs), so pin the last node-gyp major that supports each.
        run: |
          case "$(node -p "process.versions.node.split('.')[0]")" in
            19) npm install -g node-gyp@10 ;;
            18|21) npm install -g node-gyp@11 ;;
            *) npm install -g node-gyp ;;
          esac

      - name: Build native addon and copy to lib
        run: |
          node-gyp clean
          node-gyp configure
          node-gyp build
          node ./copy.cjs

      - name: Package native binary
        run: npm run package

      - name: Upload to GitHub Release
        env:
          NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing to GitHub Release..."
          npx node-pre-gyp-github publish --release
